<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Favela Tactics - Combat</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- HUD -->
        <div id="hud-container" class="hud">
            <!-- Minimap -->
            <div id="minimap-container" class="minimap-container">
                <canvas id="minimapCanvas" class="minimap"></canvas>
            </div>
            
            <!-- Compass -->
            <div id="compass" class="compass">
                <div class="compass-card">N</div>
            </div>
            
            <!-- Player Status -->
            <div id="player-status" class="player-status">
                <div class="hp-bar">
                    <div id="hp-fill" class="hp-fill"></div>
                    <span id="hp-text" class="hp-text">100/100</span>
                </div>
                <div class="ammo-info">
                    <span id="ammo-text" class="ammo-text">30/120</span>
                </div>
            </div>
            
            <!-- Weapon Info -->
            <div id="weapon-info" class="weapon-info">
                <div id="weapon-name" class="weapon-name">M16A4</div>
                <div id="weapon-icon" class="weapon-icon">🔫</div>
            </div>
            
            <!-- Team Status -->
            <div id="team-status" class="team-status">
                <div id="team-members" class="team-members"></div>
            </div>
            
            <!-- Objective -->
            <div id="objective-panel" class="objective-panel">
                <div id="objective-title" class="objective-title">Objetivo</div>
                <div id="objective-text" class="objective-text">Aguardando...</div>
                <div id="objective-progress" class="objective-progress">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </div>
            
            <!-- Messages -->
            <div id="message-log" class="message-log"></div>
        </div>
        
        <!-- Controls -->
        <div id="controls-container" class="controls">
            <!-- Left Joystick (Movement) -->
            <div id="left-joystick" class="joystick left-joystick">
                <div class="joystick-bg">
                    <div id="left-stick" class="joystick-stick"></div>
                </div>
            </div>
            
            <!-- Right Joystick (Aim) -->
            <div id="right-joystick" class="joystick right-joystick">
                <div class="joystick-bg">
                    <div id="right-stick" class="joystick-stick"></div>
                </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="button-container action-buttons">
                <button id="fire-btn" class="action-btn fire-btn" title="Atirar">
                    <span>FIRE</span>
                </button>
                <button id="reload-btn" class="action-btn reload-btn" title="Recarregar">
                    <span>RELOAD</span>
                </button>
                <button id="grenade-btn" class="action-btn grenade-btn" title="Granada">
                    <span>GRENADE</span>
                </button>
                <button id="interact-btn" class="action-btn interact-btn" title="Interagir">
                    <span>INTERACT</span>
                </button>
            </div>
            
            <!-- Quick Equipment -->
            <div class="quick-equip">
                <button id="equip-0" class="equip-slot active" data-slot="0">Slot 1</button>
                <button id="equip-1" class="equip-slot" data-slot="1">Slot 2</button>
                <button id="equip-2" class="equip-slot" data-slot="2">Granada</button>
            </div>
            
            <!-- Settings Toggle -->
            <button id="settings-btn" class="settings-btn">⚙️</button>
        </div>
        
        <!-- Settings Panel -->
        <div id="settings-panel" class="settings-panel hidden">
            <div class="settings-content">
                <h2>Configurações</h2>
                
                <div class="setting-group">
                    <label>Sensibilidade da Mira:</label>
                    <input id="aim-sensitivity" type="range" min="0.1" max="3" step="0.1" value="1">
                    <span id="aim-sens-value">1.0x</span>
                </div>
                
                <div class="setting-group">
                    <label>Sensibilidade do Movimento:</label>
                    <input id="movement-sensitivity" type="range" min="0.5" max="2" step="0.1" value="1">
                    <span id="move-sens-value">1.0x</span>
                </div>
                
                <div class="setting-group">
                    <label>Tamanho dos Controles:</label>
                    <input id="control-size" type="range" min="60" max="120" step="5" value="80">
                    <span id="control-size-value">80%</span>
                </div>
                
                <div class="setting-group">
                    <label>Qualidade Gráfica:</label>
                    <select id="graphics-quality">
                        <option value="low">Baixa (Melhor Performance)</option>
                        <option value="medium" selected>Média</option>
                        <option value="high">Alta</option>
                    </select>
                </div>
                
                <div class="setting-group">
                    <label>
                        <input type="checkbox" id="audio-toggle" checked>
                        Som Ativo
                    </label>
                </div>
                
                <div class="setting-group">
                    <label>FPS Target:</label>
                    <select id="fps-target">
                        <option value="30">30 FPS</option>
                        <option value="60" selected>60 FPS</option>
                    </select>
                </div>
                
                <button id="close-settings-btn" class="close-btn">Fechar</button>
                <button id="restart-mission-btn" class="restart-btn">Reiniciar Missão</button>
            </div>
        </div>
        
        <!-- Mission Select Panel -->
        <div id="mission-select-panel" class="mission-panel hidden">
            <div class="mission-content">
                <h2>Selecione a Missão</h2>
                <div id="mission-list" class="mission-list"></div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/map.js"></script>
    <script src="js/weapons.js"></script>
    <script src="js/npc.js"></script>
    <script src="js/pathfinding.js"></script>
    <script src="js/player.js"></script>
    <script src="js/input.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/missions.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
